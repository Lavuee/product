<div class="centering">
   <div class="all">
        <div class="text">
            <h1>PRODUCT LIST</h1>
        </div>
        <div class="colorOfTable">
            <table class="table">
                <thead>
                    <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Price</th>
                    <th scope="col">Location</th>
                    <th scope="col">Details</th>
                    <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor = "let product of products; let i = index;">
                    <th scope="row">{{product.id}}</th>
                    <td>{{product.name}}</td>
                    <td>{{product.price}}</td>
                    <td>{{product.location}}</td>
                    <td>{{product.details}}</td>
                    <td><button a [routerLink] = "['/details',product.id]">View Details</button></td>
                    </tr>    
                </tbody>
            </table>
        </div>
        <button a routerLink="/">Go Back</button>   
    </div>
</div>
